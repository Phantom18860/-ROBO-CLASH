<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBO CLASH — Battle</title>

    <link rel="stylesheet" href="css/main.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050713;
            color: white;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #battlefield {
            position: absolute;
            inset: 0;
        }

        #crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 12px #fff;
        }

        #hud {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .hud-item {
            min-width: 180px;
            padding: 10px 14px;
            background: rgba(5, 8, 25, 0.82);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-bar {
            height: 10px;
            margin-top: 7px;
            background: #25283a;
            border-radius: 10px;
            overflow: hidden;
        }

        .hud-fill {
            height: 100%;
            width: 100%;
            transition: width .2s;
        }

        .health-fill {
            background: #ff3d55;
        }

        .energy-fill {
            background: #37bfff;
        }

        .weapon-name {
            margin-left: auto;
            min-width: auto;
        }

        #enemy-hud {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            z-index: 10;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #enemy-bar {
            height: 12px;
            margin-top: 7px;
            background: #25283a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.2);
        }

        #enemy-health {
            height: 100%;
            width: 100%;
            background: #ff405b;
            transition: width .2s;
        }

        #controls {
            position: absolute;
            bottom: 22px;
            left: 22px;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(3, 52px);
            gap: 7px;
        }

        .control {
            width: 52px;
            height: 52px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            background: rgba(5,8,25,.8);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .control:active {
            transform: scale(.92);
        }

        #up {
            grid-column: 2;
        }

        #attack {
            position: absolute;
            right: 28px;
            bottom: 30px;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            background: rgba(180, 20, 40, .75);
            color: white;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 20;
            cursor: pointer;
            touch-action: manipulation;
        }

        #attack:active {
            transform: scale(.92);
        }

        #map-roll {
            position: fixed;
            inset: 0;
            background: #080b19;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .roll-title {
            font-size: 14px;
            letter-spacing: 4px;
            opacity: .65;
            margin-bottom: 25px;
        }

        #map-card {
            width: min(430px, 85vw);
            padding: 35px 20px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 18px;
            background: linear-gradient(145deg, #151a35, #090c1d);
            box-shadow: 0 0 45px rgba(70,100,255,.18);
        }

        #map-name {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        #map-description {
            margin-top: 12px;
            opacity: .65;
        }

        .roll-status {
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 3px;
        }

        .result-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .result-panel {
            width: min(620px, 88vw);
            padding: 60px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.25);
            box-shadow: 0 20px 80px rgba(0,0,0,.55);
        }

        .result-title {
            font-size: clamp(55px, 11vw, 105px);
            font-weight: 1000;
            letter-spacing: 5px;
            text-shadow: 0 8px 25px rgba(0,0,0,.4);
        }

        .result-subtitle {
            margin-top: 12px;
            opacity: .85;
            font-size: 18px;
        }

        .result-button {
            margin-top: 35px;
            padding: 15px 35px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #101225;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
        }

        #win-screen {
            background: rgba(10, 40, 150, .72);
            backdrop-filter: blur(7px);
        }

        #win-screen .result-panel {
            background: linear-gradient(145deg, #1255d8, #071d70);
        }

        #lose-screen {
            background: rgba(120, 5, 18, .75);
            backdrop-filter: blur(7px);
        }

        #lose-screen .result-panel {
            background: linear-gradient(145deg, #d51f3a, #620714);
        }

        .fall-in {
            animation: fallIn .65s cubic-bezier(.2,.9,.2,1) forwards;
        }

        @keyframes fallIn {
            from {
                transform: translateY(-120vh) rotate(-3deg);
                opacity: 0;
            }
            to {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
        }

        .fall-out {
            animation: fallOut .55s ease-in forwards;
        }

        @keyframes fallOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(120vh);
                opacity: 0;
            }
        }

        #rewards-screen {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3,5,15,.96);
        }

        #rewards-card {
            width: min(560px, 88vw);
            padding: 35px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 22px;
            background: linear-gradient(145deg, #151a32, #090c1a);
            box-shadow: 0 20px 80px rgba(0,0,0,.55);
        }

        #rewards-title {
            font-size: 34px;
            font-weight: 1000;
            letter-spacing: 3px;
        }

        #robot-display {
            width: 170px;
            height: 170px;
            margin: 25px auto;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(40,150,255,.35), transparent 65%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .reward-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .reward {
            min-width: 130px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
        }

        .reward-value {
            font-size: 26px;
            font-weight: 900;
            margin-top: 6px;
        }

        @media (max-width: 650px) {
            #hud {
                flex-wrap: wrap;
            }

            .hud-item {
                min-width: 130px;
            }

            .weapon-name {
                margin-left: 0;
            }

            #enemy-hud {
                top: 105px;
            }
        }
    </style>
</head>

<body>

<div id="map-roll">
    <div class="roll-title">SELECTING BATTLEFIELD</div>

    <div id="map-card">
        <div id="map-name">NEON CITY</div>
        <div id="map-description">A futuristic city packed with cover.</div>
    </div>

    <div class="roll-status">ROLLING...</div>
</div>

<div id="game">

    <div id="battlefield"></div>

    <div id="crosshair">+</div>

    <div id="enemy-hud">
        ENEMY
        <div id="enemy-bar">
            <div id="enemy-health"></div>
        </div>
    </div>

    <div id="hud">

        <div class="hud-item">
            HP
            <div class="hud-bar">
                <div id="health-fill" class="hud-fill health-fill"></div>
            </div>
        </div>

        <div class="hud-item">
            ENERGY
            <div class="hud-bar">
                <div id="energy-fill" class="hud-fill energy-fill"></div>
            </div>
        </div>

        <div class="hud-item weapon-name" id="weapon">
            PULSE BLASTER
        </div>

    </div>

    <div id="controls">
        <button class="control" id="up">▲</button>
        <button class="control" id="left">◀</button>
        <button class="control" id="down">▼</button>
        <button class="control" id="right">▶</button>
    </div>

    <button id="attack">FIRE</button>

</div>

<!-- WIN -->
<div id="win-screen" class="result-screen">
    <div class="result-panel">
        <div class="result-title">YOU WIN</div>
        <div class="result-subtitle">ENEMY ROBOT DESTROYED</div>
        <button class="result-button" id="continue-button">CONTINUE</button>
    </div>
</div>

<!-- LOSE -->
<div id="lose-screen" class="result-screen">
    <div class="result-panel">
        <div class="result-title">YOU LOSE</div>
        <div class="result-subtitle">YOUR ROBOT HAS BEEN DEFEATED</div>
        <button class="result-button" id="retry-button">PLAY AGAIN</button>
    </div>
</div>

<!-- REWARDS -->
<div id="rewards-screen">
    <div id="rewards-card">
        <div id="rewards-title">BATTLE REWARDS</div>

        <div id="robot-display">🤖</div>

        <div class="reward-box">
            <div class="reward">
                COINS
                <div class="reward-value">+100 🪙</div>
            </div>

            <div class="reward">
                VICTORY
                <div class="reward-value">+1 🏆</div>
            </div>
        </div>

        <button class="result-button" id="back-menu">BACK TO MENU</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   MAP ROLLER
========================= */

const rollerMaps = [
    ["NEON CITY", "A futuristic city packed with cover."],
    ["ROBOT FACTORY", "An industrial battlefield filled with machinery."],
    ["LAVA CORE", "A dangerous arena surrounding a molten reactor."],
    ["FROST BASE", "A frozen military base built for combat."],
    ["SCRAP DESERT", "A battlefield filled with abandoned machines."]
];

const rollName = document.getElementById("map-name");
const rollDescription = document.getElementById("map-description");
const rollScreen = document.getElementById("map-roll");
const rollStatus = document.querySelector(".roll-status");

let rollNumber = 0;

const rollTimer = setInterval(() => {
    const map = rollerMaps[rollNumber % rollerMaps.length];

    rollName.textContent = map[0];
    rollDescription.textContent = map[1];

    rollNumber++;
}, 120);

setTimeout(() => {
    clearInterval(rollTimer);

    const chosen =
        rollerMaps[Math.floor(Math.random() * rollerMaps.length)];

    rollName.textContent = chosen[0];
    rollDescription.textContent = chosen[1];

    rollStatus.textContent = "SELECTED MAP";

    setTimeout(() => {
        rollScreen.style.display = "none";
    }, 1000);

}, 2500);


/* =========================
   THREE.JS ARENA
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a18);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 9, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.getElementById("battlefield").appendChild(renderer.domElement);


/* LIGHTING */

const ambient = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambient);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 12, 7);
scene.add(light);


/* ARENA FLOOR */

const floorGeometry = new THREE.PlaneGeometry(40, 40);
const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x151a2b,
    roughness: .8
});

const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);


/* ARENA GRID */

const grid = new THREE.GridHelper(40, 40, 0x354060, 0x20263c);
grid.position.y = 0.02;
scene.add(grid);


/* WALLS */

function makeWall(x, z, sx, sz) {
    const geometry = new THREE.BoxGeometry(sx, 2, sz);

    const material = new THREE.MeshStandardMaterial({
        color: 0x242b43,
        roughness: .65
    });

    const wall = new THREE.Mesh(geometry, material);

    wall.position.set(x, 1, z);

    scene.add(wall);
}

makeWall(0, -18, 40, 1);
makeWall(0, 18, 40, 1);
makeWall(-18, 0, 1, 40);
makeWall(18, 0, 1, 40);


/* =========================
   ROBOTS
========================= */

function createRobot(bodyColor) {

    const robot = new THREE.Group();

    const bodyMaterial = new THREE.MeshStandardMaterial({
        color: bodyColor,
        metalness: .7,
        roughness: .3
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
        color: 0x151820,
        metalness: .8,
        roughness: .25
    });

    const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0x49cfff,
        emissive: 0x168cff,
        emissiveIntensity: 2
    });

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.1, 1.8, 1.5),
        bodyMaterial
    );

    body.position.y = 1.8;
    robot.add(body);

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 1.1, 1.3),
        darkMaterial
    );

    head.position.y = 3.25;
    robot.add(head);

    const eye = new THREE.Mesh(
        new THREE.BoxGeometry(.9, .18, .08),
        eyeMaterial
    );

    eye.position.set(0, 3.3, -.67);
    robot.add(eye);

    const armGeometry = new THREE.BoxGeometry(.55, 1.5, .65);

    const leftArm = new THREE.Mesh(
        armGeometry,
        bodyMaterial
    );

    leftArm.position.set(-1.35, 1.8, 0);
    robot.add(leftArm);

    const rightArm = new THREE.Mesh(
        armGeometry,
        bodyMaterial
    );

    rightArm.position.set(1.35, 1.8, 0);
    robot.add(rightArm);

    const legGeometry = new THREE.BoxGeometry(.65, 1.1, .7);

    const leftLeg = new THREE.Mesh(
        legGeometry,
        darkMaterial
    );

    leftLeg.position.set(-.55, .55, 0);
    robot.add(leftLeg);

    const rightLeg = new THREE.Mesh(
        legGeometry,
        darkMaterial
    );

    rightLeg.position.set(.55, .55, 0);
    robot.add(rightLeg);

    return robot;
}

const player = createRobot(0x2878ff);
player.position.set(0, 0, 8);
player.rotation.y = Math.PI;

scene.add(player);

const enemy = createRobot(0xff304f);
enemy.position.set(0, 0, -8);

scene.add(enemy);


/* =========================
   GAME VARIABLES
========================= */

let playerHP = 100;
let enemyHP = 100;
let energy = 100;
let gameOver = false;
let enemyAttackTimer = 0;


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("health-fill").style.width =
        playerHP + "%";

    document.getElementById("enemy-health").style.width =
        enemyHP + "%";

    document.getElementById("energy-fill").style.width =
        energy + "%";
}


/* =========================
   MOVEMENT
========================= */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function movePlayer(direction) {

    if (gameOver) return;

    const speed = .7;

    if (direction === "up") player.position.z -= speed;
    if (direction === "down") player.position.z += speed;
    if (direction === "left") player.position.x -= speed;
    if (direction === "right") player.position.x += speed;

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -15,
        15
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z,
        -14,
        14
    );
}


/* KEYBOARD CONTROLS */

function keyboardMovement() {

    if (keys["w"] || keys["arrowup"]) movePlayer("up");
    if (keys["s"] || keys["arrowdown"]) movePlayer("down");
    if (keys["a"] || keys["arrowleft"]) movePlayer("left");
    if (keys["d"] || keys["arrowright"]) movePlayer("right");
}


/* MOBILE BUTTONS */

document.getElementById("up").addEventListener("click", () => {
    movePlayer("up");
});

document.getElementById("down").addEventListener("click", () => {
    movePlayer("down");
});

document.getElementById("left").addEventListener("click", () => {
    movePlayer("left");
});

document.getElementById("right").addEventListener("click", () => {
    movePlayer("right");
});


/* =========================
   ATTACK
========================= */

function attack() {

    if (gameOver) return;
    if (energy < 20) return;

    energy -= 20;

    const distance = player.position.distanceTo(enemy.position);

    if (distance < 12) {
        enemyHP -= 20;

        enemyHP = Math.max(0, enemyHP);

        enemy.position.x +=
            (Math.random() - .5) * 1.2;

        if (enemyHP <= 0) {
            winGame();
        }
    }

    updateHUD();
}

document.getElementById("attack").addEventListener("click", attack);

document.addEventListener("keydown", e => {

    if (e.code === "Space") {
        e.preventDefault();
        attack();
    }

});


/* =========================
   ENEMY AI
========================= */

function enemyAI(delta) {

    if (gameOver) return;

    enemyAttackTimer += delta;

    const distance = enemy.position.distanceTo(player.position);

    if (distance > 4) {

        enemy.lookAt(
            player.position.x,
            enemy.position.y,
            player.position.z
        );

        enemy.position.z +=
            player.position.z > enemy.position.z ? .012 : -.012;

        enemy.position.x +=
            player.position.x > enemy.position.x ? .012 : -.012;
    }

    if (enemyAttackTimer > 2.2 && distance < 10) {

        playerHP -= 8;

        playerHP = Math.max(0, playerHP);

        enemyAttackTimer = 0;

        updateHUD();

        if (playerHP <= 0) {
            loseGame();
        }
    }
}


/* =========================
   WIN
========================= */

function winGame() {

    gameOver = true;

    const screen = document.getElementById("win-screen");

    screen.style.display = "flex";

    const panel = screen.querySelector(".result-panel");

    panel.classList.remove("fall-out");
    panel.classList.add("fall-in");

}


/* =========================
   LOSE
========================= */

function loseGame() {

    gameOver = true;

    const screen = document.getElementById("lose-screen");

    screen.style.display = "flex";

    const panel = screen.querySelector(".result-panel");

    panel.classList.remove("fall-out");
    panel.classList.add("fall-in");

}


/* =========================
   WIN → REWARDS
========================= */

document.getElementById("continue-button")
    .addEventListener("click", () => {

        const screen = document.getElementById("win-screen");
        const panel = screen.querySelector(".result-panel");

        panel.classList.remove("fall-in");
        panel.classList.add("fall-out");

        setTimeout(() => {

            screen.style.display = "none";

            document.getElementById("rewards-screen")
                .style.display = "flex";

            addCoins(100);

        }, 550);

    });


/* =========================
   LOSE → RESTART
========================= */

document.getElementById("retry-button")
    .addEventListener("click", () => {

        location.reload();

    });


/* =========================
   COINS
========================= */

function addCoins(amount) {

    let coins =
        Number(localStorage.getItem("roboClashCoins") || 0);

    coins += amount;

    localStorage.setItem(
        "roboClashCoins",
        coins
    );
}


/* =========================
   BACK TO MENU
========================= */

document.getElementById("back-menu")
    .addEventListener("click", () => {

        window.location.href = "index.html";

    });


/* =========================
   CAMERA + GAME LOOP
========================= */

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    keyboardMovement();
    enemyAI(delta);

    camera.position.x +=
        (player.position.x * .45 - camera.position.x) * .08;

    camera.position.z +=
        ((player.position.z + 10) - camera.position.z) * .05;

    camera.lookAt(
        player.position.x,
        0,
        player.position.z - 2
    );

    energy = Math.min(
        100,
        energy + delta * 5
    );

    updateHUD();

    renderer.render(scene, camera);
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});
</script>

</body>
</html>
