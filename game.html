<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBO CLASH — Battle</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>

    <div id="map-roll">
        <div class="roll-title">SELECTING BATTLEFIELD</div>

        <div id="map-card">
            <div id="map-name">NEON CITY</div>
            <div id="map-description">A futuristic city packed with cover.</div>
        </div>

        <div class="roll-status">ROLLING...</div>
    </div>

    <div id="game">

        <div id="crosshair">+</div>

        <div id="hud">

            <div class="hud-item">
                HP
                <div class="hud-bar">
                    <div id="health-fill" class="hud-fill health-fill"></div>
                </div>
            </div>

            <div class="hud-item">
                ENERGY
                <div class="hud-bar">
                    <div id="energy-fill" class="hud-fill energy-fill"></div>
                </div>
            </div>

            <div class="hud-item weapon-name" id="weapon">
                PULSE BLASTER
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
