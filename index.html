<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROBO CLASH</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070a12;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  background:
    radial-gradient(circle at center,#29365f,#0b1020 55%,#03040a);
}

#menu h1{
  margin:0;
  font-size:clamp(48px,9vw,90px);
  letter-spacing:8px;
  text-shadow:
    0 0 15px #00eaff,
    0 0 40px #5365ff;
}

#menu p{
  color:#aeb9d7;
  letter-spacing:4px;
  margin:10px 0 35px;
}

button{
  font:inherit;
  cursor:pointer;
}

.menuButton{
  width:250px;
  margin:6px;
  padding:15px;
  border:1px solid #6878ff;
  border-radius:12px;
  background:#151c38;
  color:white;
  font-weight:bold;
  font-size:18px;
}

.menuButton:hover{
  background:#2a3976;
}

#hud{
  position:fixed;
  left:15px;
  top:15px;
  z-index:10;
  color:white;
  font-weight:bold;
  line-height:1.6;
  text-shadow:0 2px 5px #000;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  color:white;
  font-size:26px;
  pointer-events:none;
}

#help{
  position:fixed;
  right:15px;
  top:15px;
  z-index:10;
  color:#c1c9df;
  font-size:12px;
  text-align:right;
  line-height:1.5;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="menu">
  <h1>ROBO CLASH</h1>
  <p>TINY ROBOTS • BIG BATTLES</p>

  <button class="menuButton" id="playButton">
    PLAY
  </button>

  <button class="menuButton" id="weaponsButton">
    WEAPONS
  </button>

  <button class="menuButton" id="controlsButton">
    CONTROLS
  </button>
</div>

<div id="hud" class="hidden">
  ❤️ HP: <span id="hp">100</span><br>
  🏆 ELIMINATIONS: <span id="score">0</span><br>
  ⚡ <span id="weapon">PULSE BLASTER</span>
</div>

<div id="crosshair" class="hidden">+</div>

<div id="help" class="hidden">
  WASD — MOVE<br>
  SPACE — JUMP<br>
  MOUSE — AIM<br>
  CLICK — FIRE<br>
  1 / 2 / 3 — WEAPONS
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   ROBO CLASH
   ========================================================= */

let scene;
let camera;
let renderer;

let player;

let enemies=[];
let projectiles=[];
let particles=[];

let running=false;

let playerHP=100;
let score=0;

let velocityY=0;
let grounded=true;

let yaw=0;
let pitch=0;

let lastShot=0;
let currentWeapon=0;

const keys={};

const GRAVITY=-0.018;
const JUMP=0.38;

const weapons=[

  {
    name:"PULSE BLASTER",
    speed:1.8,
    damage:1,
    cooldown:220,
    color:0x00eaff
  },

  {
    name:"VOLT CANNON",
    speed:2.2,
    damage:2,
    cooldown:380,
    color:0xffff33
  },

  {
    name:"NOVA LAUNCHER",
    speed:1.1,
    damage:4,
    cooldown:700,
    color:0xff6a2a
  }

];


/* =========================================================
   MENU
   ========================================================= */

document.getElementById("playButton").onclick=startGame;

document.getElementById("weaponsButton").onclick=()=>{

  alert(
    "ROBO CLASH WEAPONS\n\n"+
    "1 — Pulse Blaster\n"+
    "2 — Volt Cannon\n"+
    "3 — Nova Launcher"
  );

};

document.getElementById("controlsButton").onclick=()=>{

  alert(
    "WASD — Move\n"+
    "SPACE — Jump\n"+
    "Mouse — Look\n"+
    "Click — Fire\n"+
    "1 / 2 / 3 — Change weapon"
  );

};


/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("crosshair")
    .classList.remove("hidden");

  document.getElementById("help")
    .classList.remove("hidden");

  if(!scene){

    createWorld();

  }

  running=true;

  renderer.domElement.requestPointerLock();

}


/* =========================================================
   WORLD
   ========================================================= */

function createWorld(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x070b18);

  scene.fog=
    new THREE.Fog(
      0x070b18,
      20,
      100
    );


  camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.05,
    250
  );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled=true;

  document.body.appendChild(
    renderer.domElement
  );


  /* LIGHT */

  scene.add(
    new THREE.HemisphereLight(
      0x8db5ff,
      0x101018,
      1.5
    )
  );

  const light=
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  light.position.set(
    10,
    25,
    5
  );

  light.castShadow=true;

  scene.add(light);


  /* FLOOR */

  const floor=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        70,
        1,
        70
      ),

      new THREE.MeshStandardMaterial({
        color:0x171c2d,
        roughness:.8
      })

    );

  floor.position.y=-0.5;

  floor.receiveShadow=true;

  scene.add(floor);


  /* GRID */

  const grid=
    new THREE.GridHelper(
      70,
      35,
      0x5264c5,
      0x252a45
    );

  grid.position.y=0.02;

  scene.add(grid);


  /* WALLS */

  makeWall(
    0,3,-35,
    70,1
  );

  makeWall(
    0,3,35,
    70,1
  );

  makeWall(
    -35,3,0,
    1,70
  );

  makeWall(
    35,3,0,
    1,70
  );


  /* COVER */

  for(let i=0;i<18;i++){

    const w=
      2+
      Math.random()*3;

    const h=
      1.5+
      Math.random()*3;

    const d=
      2+
      Math.random()*3;


    const cover=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          w,h,d
        ),

        new THREE.MeshStandardMaterial({
          color:0x303851
        })

      );

    cover.position.set(

      (Math.random()-.5)*55,

      h/2,

      (Math.random()-.5)*55

    );

    cover.castShadow=true;
    cover.receiveShadow=true;

    scene.add(cover);

  }


  /* PLAYER */

  player=
    createRobot(
      0x00eaff
    );

  player.position.set(
    0,
    0,
    15
  );

  scene.add(player);


  /* ENEMIES */

  for(let i=0;i<6;i++){

    spawnEnemy();

  }


  animate();

}


/* =========================================================
   WALL
   ========================================================= */

function makeWall(
  x,y,z,
  width,depth
){

  const wall=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        6,
        depth
      ),

      new THREE.MeshStandardMaterial({
        color:0x0f1425
      })

    );

  wall.position.set(
    x,y,z
  );

  scene.add(wall);

}


/* =========================================================
   ROBOT
   ========================================================= */

function createRobot(color){

  const robot=
    new THREE.Group();


  const bodyMaterial=
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.4,
      roughness:.35
    });

  const darkMaterial=
    new THREE.MeshStandardMaterial({
      color:0x202638,
      metalness:.5,
      roughness:.3
    });


  /* BODY */

  const body=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.4,
        1.2,
        1.1
      ),

      bodyMaterial

    );

  body.position.y=1.1;

  body.castShadow=true;

  robot.add(body);


  /* HEAD */

  const head=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.15,
        .7,
        .95
      ),

      darkMaterial

    );

  head.position.y=1.95;

  head.castShadow=true;

  robot.add(head);


  /* VISOR */

  const visor=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        .8,
        .16,
        .06
      ),

      new THREE.MeshBasicMaterial({
        color:color
      })

    );

  visor.position.set(
    0,
    1.95,
    -.51
  );

  robot.add(visor);


  /* ARMS */

  for(
    const side of[-1,1]
  ){

    const arm=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .32,
          .9,
          .36
        ),

        darkMaterial

      );

    arm.position.set(
      side*.87,
      1.05,
      0
    );

    arm.castShadow=true;

    robot.add(arm);

  }


  /* LEGS */

  for(
    const side of[-1,1]
  ){

    const leg=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .42,
          .75,
          .48
        ),

        darkMaterial

      );

    leg.position.set(
      side*.36,
      .25,
      0
    );

    leg.castShadow=true;

    robot.add(leg);

  }


  /* ANTENNA */

  const antenna=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .035,
        .035,
        .4,
        8
      ),

      darkMaterial

    );

  antenna.position.y=2.5;

  robot.add(antenna);


  const antennaLight=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .1,
        8,
        8
      ),

      new THREE.MeshBasicMaterial({
        color:color
      })

    );

  antennaLight.position.y=2.73;

  robot.add(antennaLight);


  return robot;

}


/* =========================================================
   ENEMY
   ========================================================= */

function spawnEnemy(){

  const enemy=
    createRobot(
      0xff3868
    );

  enemy.position.set(

    (Math.random()-.5)*50,

    0,

    (Math.random()-.5)*45-5

  );

  enemy.userData.hp=5;

  enemy.userData.speed=
    .012+
    Math.random()*.012;

  scene.add(enemy);

  enemies.push(enemy);

}


/* =========================================================
   KEYBOARD
   ========================================================= */

addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){

      jump();

    }

    if(
      e.key>="1" &&
      e.key<="3"
    ){

      setWeapon(
        Number(e.key)-1
      );

    }

  }
);

addEventListener(
  "keyup",
  e=>{

    keys[e.key.toLowerCase()]=false;

  }
);


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

  if(
    grounded &&
    running
  ){

    velocityY=
      JUMP;

    grounded=false;

  }

}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(){

  if(!player)return;


  let forward=0;
  let right=0;


  if(
    keys["w"] ||
    keys["arrowup"]
  )
    forward+=1;

  if(
    keys["s"] ||
    keys["arrowdown"]
  )
    forward-=1;

  if(
    keys["d"] ||
    keys["arrowright"]
  )
    right+=1;

  if(
    keys["a"] ||
    keys["arrowleft"]
  )
    right-=1;


  const movement=
    new THREE.Vector3(
      right,
      0,
      -forward
    );


  if(
    movement.lengthSq()>0
  ){

    movement.normalize();

    movement.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      yaw
    );

    player.position.addScaledVector(
      movement,
      .16
    );

  }


  /* GRAVITY */

  velocityY+=
    GRAVITY;

  player.position.y+=
    velocityY;


  if(
    player.position.y<=0
  ){

    player.position.y=0;

    velocityY=0;

    grounded=true;

  }


  /* BOUNDS */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -32,
      32
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -32,
      32
    );


  /* CAMERA */

  camera.position.copy(
    player.position
  );

  camera.position.y+=1.55;


  camera.rotation.order=
    "YXZ";

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

}


/* =========================================================
   MOUSE LOOK
   ========================================================= */

addEventListener(
  "mousemove",
  e=>{

    if(
      !running ||
      document.pointerLockElement
      !==renderer.domElement
    )
      return;


    yaw-=
      e.movementX*.0025;

    pitch-=
      e.movementY*.0025;


    pitch=
      THREE.MathUtils.clamp(
        pitch,
        -1.35,
        1.35
      );

  }
);


/* =========================================================
   WEAPON
   ========================================================= */

function setWeapon(index){

  currentWeapon=index;

  document.getElementById(
    "weapon"
  ).textContent=
    weapons[index].name;

}


/* =========================================================
   SHOOT
   ========================================================= */

addEventListener(
  "mousedown",
  e=>{

    if(e.button===0)
      shoot();

  }
);


function shoot(){

  if(!running)return;

  const now=
    performance.now();

  const weapon=
    weapons[currentWeapon];


  if(
    now-lastShot<
    weapon.cooldown
  )
    return;


  lastShot=now;


  const projectile=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .11,
        8,
        8
      ),

      new THREE.MeshBasicMaterial({
        color:weapon.color
      })

    );


  const direction=
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyEuler(
    new THREE.Euler(
      pitch,
      yaw,
      0,
      "YXZ"
    )
  );


  projectile.position.copy(
    camera.position
  );


  projectile.userData.velocity=
    direction.multiplyScalar(
      weapon.speed
    );

  projectile.userData.damage=
    weapon.damage;


  scene.add(
    projectile
  );

  projectiles.push(
    projectile
  );

}


/* =========================================================
   ENEMIES
   ========================================================= */

function updateEnemies(){

  enemies.forEach(
    enemy=>{

      const dx=
        player.position.x-
        enemy.position.x;

      const dz=
        player.position.z-
        enemy.position.z;

      const distance=
        Math.hypot(dx,dz);


      if(
        distance>2.5
      ){

        enemy.position.x+=
          dx/distance*
          enemy.userData.speed;

        enemy.position.z+=
          dz/distance*
          enemy.userData.speed;

        enemy.rotation.y=
          Math.atan2(
            dx,
            dz
          );

      }else{

        playerHP-=.08;

        updateHP();

      }

    }
  );

}


/* =========================================================
   PROJECTILES
   ========================================================= */

function updateProjectiles(){

  for(
    let i=projectiles.length-1;
    i>=0;
    i--
  ){

    const projectile=
      projectiles[i];


    projectile.position.add(
      projectile.userData.velocity
    );


    let hit=false;


    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const enemy=
        enemies[j];


      if(
        projectile.position.distanceTo(
          enemy.position
        )<1.35
      ){

        enemy.userData.hp-=
          projectile.userData.damage;


        createParticles(
          projectile.position,
          weapons[currentWeapon].color
        );


        scene.remove(
          projectile
        );

        projectiles.splice(
          i,
          1
        );

        hit=true;


        if(
          enemy.userData.hp<=0
        ){

          scene.remove(
            enemy
          );

          enemies.splice(
            j,
            1
          );


          score+=1;

          document.getElementById(
            "score"
          ).textContent=
            score;


          setTimeout(
            spawnEnemy,
            500
          );

        }


        break;

      }

    }


    if(
      !hit &&
      projectile.position.length()>100
    ){

      scene.remove(
        projectile
      );

      projectiles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
  position,
  color
){

  for(let i=0;i<8;i++){

    const particle=
      new THREE.Mesh(

        new THREE.SphereGeometry(
          .045,
          5,
          5
        ),

        new THREE.MeshBasicMaterial({
          color:color
        })

      );


    particle.position.copy(
      position
    );


    particle.userData.velocity=
      new THREE.Vector3(
        Math.random()-.5,
        Math.random()-.2,
        Math.random()-.5
      ).multiplyScalar(.12);


    particle.userData.life=
      25;


    scene.add(
      particle
    );

    particles.push(
      particle
    );

  }

}


function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];


    p.position.add(
      p.userData.velocity
    );

    p.userData.life--;


    if(
      p.userData.life<=0
    ){

      scene.remove(p);

      particles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   HEALTH
   ========================================================= */

function updateHP(){

  document.getElementById(
    "hp"
  ).textContent=
    Math.max(
      0,
      Math.floor(playerHP)
    );


  if(
    playerHP<=0
  ){

    running=false;

    document.exitPointerLock();

    setTimeout(
      ()=>{

        alert(
          "ROBO CLASH\n\n"+
          "ELIMINATIONS: "+
          score
        );

        location.reload();

      },
      100
    );

  }

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(!scene)return;


  if(running){

    updatePlayer();

    updateEnemies();

    updateProjectiles();

    updateParticles();

  }


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener(
  "resize",
  ()=>{

    if(
      !camera ||
      !renderer
    )
      return;


    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
