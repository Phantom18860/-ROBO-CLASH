<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROBO CLASH</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050711;font-family:Arial;color:white}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:radial-gradient(circle,#26345c,#090c18 55%,#020307);
}
h1{font-size:64px;letter-spacing:8px;margin:0;text-shadow:0 0 25px #28dfff}
.sub{color:#9ca8c8;letter-spacing:4px;margin:8px 0 35px}
button{
 border:1px solid #5365ff;border-radius:10px;background:#111936;
 color:white;padding:13px 25px;font-size:17px;font-weight:bold;
 cursor:pointer
}
.menuBtn{width:240px;margin:6px}
button:hover{background:#283777}
#hud{
 position:fixed;top:15px;left:15px;z-index:3;
 font-weight:bold;line-height:1.6;text-shadow:0 2px 4px #000
}
#crosshair{
 position:fixed;left:50%;top:50%;z-index:3;
 transform:translate(-50%,-50%);font-size:25px;pointer-events:none
}
#weapons{
 position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 z-index:3;display:flex;gap:6px
}
.weapon{padding:8px 10px;font-size:13px}
.active{background:#4658d9}
#help{
 position:fixed;right:15px;top:15px;z-index:3;
 font-size:12px;text-align:right;color:#b9c2df
}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="menu">
  <h1>ROBO CLASH</h1>
  <div class="sub">TINY ROBOTS. BIG BATTLES.</div>
  <button class="menuBtn" onclick="start()">PLAY</button>
  <button class="menuBtn" onclick="weapons()">WEAPONS</button>
  <button class="menuBtn" onclick="controls()">CONTROLS</button>
</div>

<div id="hud" class="hidden">
❤️ HP: <span id="hp">100</span><br>
🏆 SCORE: <span id="score">0</span><br>
⚡ <span id="gun">PULSE</span>
</div>

<div id="crosshair" class="hidden">+</div>

<div id="help" class="hidden">
WASD / ARROWS — MOVE<br>
MOUSE — AIM<br>
CLICK — FIRE<br>
1–4 — WEAPONS
</div>

<div id="weapons" class="hidden">
<button class="weapon active" onclick="setGun(0)">1 PULSE</button>
<button class="weapon" onclick="setGun(1)">2 VOLT</button>
<button class="weapon" onclick="setGun(2)">3 NOVA</button>
<button class="weapon" onclick="setGun(3)">4 RAIL</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene,camera,renderer,player;
let enemies=[],shots=[];
let running=false,hp=100,score=0,gun=0,lastShot=0;
const keys={};

const guns=[
 {name:"PULSE",speed:1.3,damage:1,cool:220,color:0x00eaff},
 {name:"VOLT",speed:1.8,damage:1,cool:110,color:0xffff33},
 {name:"NOVA",speed:.8,damage:4,cool:650,color:0xff6622},
 {name:"RAIL",speed:2.7,damage:5,cool:850,color:0xffffff}
];

function start(){
 document.getElementById("menu").classList.add("hidden");
 ["hud","crosshair","help","weapons"].forEach(x=>
   document.getElementById(x).classList.remove("hidden"));
 if(!scene) build();
 running=true;
}

function weapons(){
 alert("PULSE — balanced\nVOLT — rapid\nNOVA — powerful\nRAIL — precise");
}

function controls(){
 alert("WASD / ARROWS = move\nMouse = aim\nClick = fire\n1–4 = weapon");
}

function build(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x070a18);
 scene.fog=new THREE.Fog(0x070a18,30,90);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0x9db8ff,0x111122,1.6));

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(10,20,10);
 sun.castShadow=true;
 scene.add(sun);

 const floor=new THREE.Mesh(
   new THREE.BoxGeometry(44,1,44),
   new THREE.MeshStandardMaterial({color:0x151a2b})
 );
 floor.position.y=-.6;
 floor.receiveShadow=true;
 scene.add(floor);

 scene.add(new THREE.GridHelper(44,22,0x5261bd,0x242943));

 for(let i=0;i<10;i++){
   const box=new THREE.Mesh(
     new THREE.BoxGeometry(2,2,2),
     new THREE.MeshStandardMaterial({color:0x30374e})
   );
   box.position.set((Math.random()-.5)*34,1,(Math.random()-.5)*34);
   box.castShadow=true;
   scene.add(box);
 }

 player=robot(0x00dfff);
 player.position.set(0,0,14);
 scene.add(player);

 for(let i=0;i<5;i++)spawn();

 animate();
}

function robot(color){
 const r=new THREE.Group();

 const mat=new THREE.MeshStandardMaterial({
   color:color,metalness:.35,roughness:.35
 });
 const dark=new THREE.MeshStandardMaterial({
   color:0x24293a,metalness:.5,roughness:.3
 });

 function part(geo,m,x,y,z){
   const o=new THREE.Mesh(geo,m);
   o.position.set(x,y,z);
   o.castShadow=true;
   r.add(o);
 }

 part(new THREE.BoxGeometry(1.5,1.15,1.2),mat,0,1.05,0);
 part(new THREE.BoxGeometry(1.2,.75,1),dark,0,1.9,0);
 part(new THREE.BoxGeometry(.85,.18,.08),
      new THREE.MeshBasicMaterial({color}),0,1.92,-.54);

 part(new THREE.BoxGeometry(.35,.9,.4),dark,-.92,1,0);
 part(new THREE.BoxGeometry(.35,.9,.4),dark,.92,1,0);
 part(new THREE.BoxGeometry(.45,.75,.5),dark,-.4,.25,0);
 part(new THREE.BoxGeometry(.45,.75,.5),dark,.4,.25,0);

 const antenna=new THREE.Mesh(
   new THREE.CylinderGeometry(.04,.04,.4,8),dark);
 antenna.position.y=2.48;
 r.add(antenna);

 const light=new THREE.Mesh(
   new THREE.SphereGeometry(.1,8,8),
   new THREE.MeshBasicMaterial({color}));
 light.position.y=2.72;
 r.add(light);

 return r;
}

function spawn(){
 const e=robot(0xff3d69);
 e.position.set((Math.random()-.5)*34,0,(Math.random()-.5)*25-5);
 e.userData.hp=5;
 e.userData.speed=.012+Math.random()*.012;
 scene.add(e);
 enemies.push(e);
}

function setGun(i){
 gun=i;
 document.getElementById("gun").textContent=guns[i].name;
 document.querySelectorAll(".weapon").forEach((b,n)=>
   b.classList.toggle("active",n===i));
}

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key>="1"&&e.key<="4")setGun(+e.key-1);
});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

addEventListener("mousedown",e=>{
 if(e.button===0)shoot();
});

addEventListener("mousemove",e=>{
 if(!running)return;
 const dx=e.clientX-innerWidth/2;
 const dz=e.clientY-innerHeight/2;
 if(Math.abs(dx)+Math.abs(dz)>8)
   player.rotation.y=Math.atan2(dx,-dz);
});

function shoot(){
 if(!running)return;

 const now=performance.now();
 const w=guns[gun];
 if(now-lastShot<w.cool)return;
 lastShot=now;

 const s=new THREE.Mesh(
   new THREE.SphereGeometry(.13,8,8),
   new THREE.MeshBasicMaterial({color:w.color})
 );

 s.position.copy(player.position);
 s.position.y+=1.15;

 const d=new THREE.Vector3(0,0,-1);
 d.applyQuaternion(player.quaternion);

 s.userData.v=d.multiplyScalar(w.speed);
 s.userData.damage=w.damage;

 scene.add(s);
 shots.push(s);
}

function updatePlayer(){
 let x=0,z=0;

 if(keys["a"]||keys["arrowleft"])x--;
 if(keys["d"]||keys["arrowright"])x++;
 if(keys["w"]||keys["arrowup"])z--;
 if(keys["s"]||keys["arrowdown"])z++;

 if(x||z){
   const l=Math.hypot(x,z);
   player.position.x+=x/l*.13;
   player.position.z+=z/l*.13;
 }

 player.position.x=Math.max(-20,Math.min(20,player.position.x));
 player.position.z=Math.max(-20,Math.min(20,player.position.z));
}

function updateEnemies(){
 enemies.forEach(e=>{
   const dx=player.position.x-e.position.x;
   const dz=player.position.z-e.position.z;
   const d=Math.hypot(dx,dz);

   if(d>2){
     e.position.x+=dx/d*e.userData.speed;
     e.position.z+=dz/d*e.userData.speed;
     e.rotation.y=Math.atan2(dx,dz);
   }else{
     hp-=.08;
     updateHP();
   }
 });
}

function updateShots(){
 for(let i=shots.length-1;i>=0;i--){
   const s=shots[i];
   s.position.add(s.userData.v);

   let hit=false;

   for(let j=enemies.length-1;j>=0;j--){
     const e=enemies[j];

     if(s.position.distanceTo(e.position)<1.3){
       e.userData.hp-=s.userData.damage;
       scene.remove(s);
       shots.splice(i,1);
       hit=true;

       if(e.userData.hp<=0){
         scene.remove(e);
         enemies.splice(j,1);
         score+=10;
         document.getElementById("score").textContent=score;
         setTimeout(spawn,400);
       }
       break;
     }
   }

   if(!hit && Math.abs(s.position.x)>60){
     scene.remove(s);
     shots.splice(i,1);
   }
 }
}

function updateCamera(){
 const target=new THREE.Vector3(
   player.position.x,
   player.position.y+7,
   player.position.z+9
 );

 camera.position.lerp(target,.08);
 camera.lookAt(
   player.position.x,
   player.position.y+1,
   player.position.z
 );
}

function updateHP(){
 document.getElementById("hp").textContent=Math.max(0,Math.floor(hp));

 if(hp<=0){
   running=false;
   setTimeout(()=>{
     alert("ROBO CLASH\n\nScore: "+score);
     location.reload();
   },50);
 }
}

function animate(){
 requestAnimationFrame(animate);

 if(scene){
   if(running){
     updatePlayer();
     updateEnemies();
     updateShots();
     updateCamera();
   }
   renderer.render(scene,camera);
 }
}

addEventListener("resize",()=>{
 if(!camera)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
