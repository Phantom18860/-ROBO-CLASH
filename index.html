<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBO CLASH</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        .coin-button {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 55px;
            height: 55px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }

        .coin-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.15s;
        }

        .coin-button:hover img {
            transform: scale(1.08);
        }

        .coin-button:active img {
            transform: scale(0.94);
        }

        .coin-panel {
            display: none;
            position: absolute;
            top: 82px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(10, 20, 38, 0.96);
            border: 1px solid rgba(80, 190, 255, 0.5);
            color: white;
            text-align: center;
            z-index: 9;
        }

        .coin-panel.show {
            display: block;
        }

        .coin-label {
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.75;
        }

        .coin-amount {
            margin-top: 5px;
            font-size: 30px;
            font-weight: 900;
        }
    </style>
</head>

<body>

<div class="menu-status">
    SYSTEM ONLINE
</div>

<!-- RC COIN -->
<button
    class="coin-button"
    id="coinButton"
    type="button"
    aria-label="Show coins"
>
    <img
        src="assets/robo-coin.png"
        alt="ROBO CLASH coin"
    >
</button>

<!-- COIN BALANCE -->
<div
    class="coin-panel"
    id="coinPanel"
>
    <div class="coin-label">
        YOUR COINS
    </div>

    <div class="coin-amount">
        🪙 <span id="coinCount">0</span>
    </div>
</div>

<main class="menu-screen">

    <img
        class="game-logo"
        src="assets/ChatGPT%20Image%20Sep%202%2C%202026%2C%2011_00_44%20AM.png"
        alt="ROBO CLASH"
    >

    <div class="menu-buttons">

        <a class="menu-button primary" href="game.html">
            PLAY
        </a>

        <a class="menu-button" href="rooms.html">
            ROOMS
        </a>

        <a class="menu-button" href="robots.html">
            ROBOTS
        </a>

        <a class="menu-button" href="armory.html">
            ARMORY
        </a>

        <a class="menu-button" href="customize.html">
            CUSTOMIZE
        </a>

        <a class="menu-button" href="stats.html">
            STATS
        </a>

        <a class="menu-button" href="settings.html">
            SETTINGS
        </a>

    </div>

</main>

<script>

    const coinButton =
        document.getElementById("coinButton");

    const coinPanel =
        document.getElementById("coinPanel");

    const coinCount =
        document.getElementById("coinCount");


    let coins = Number(
        localStorage.getItem("roboClashCoins") || 0
    );


    coinCount.textContent = coins;


    coinButton.addEventListener(
        "click",
        () => {
            coinPanel.classList.toggle("show");
        }
    );

</script>

</body>
</html>
