<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBO CLASH — Customize</title>

    <link rel="stylesheet" href="css/main.css">

    <style>
        body {
            margin: 0;
            background: #10152b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .customize-page {
            width: min(700px, 92%);
            margin: 40px auto;
        }

        .customize-title {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .customize-option {
            background: #1b2342;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .option-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #10152b;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 13px 22px;
            margin-top: 10px;
            border: 0;
            border-radius: 9px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        /* ROBOTS */

        .coin-display {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            background: #10152b;
            text-align: center;
            font-weight: 900;
        }

        .robot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .robot-card {
            position: relative;
            padding: 18px 10px;
            margin: 0;
            min-height: 120px;
            background: #10152b;
            border: 2px solid rgba(255,255,255,.1);
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }

        .robot-card.selected {
            border-color: #ffd166;
        }

        .robot-card.locked {
            opacity: .45;
        }

        .robot-icon {
            font-size: 42px;
            display: block;
            margin-bottom: 7px;
        }

        .robot-name {
            font-size: 14px;
            font-weight: 900;
        }

        .robot-price {
            margin-top: 5px;
            font-size: 12px;
            opacity: .75;
        }

        .locked-text {
            color: #ff667a;
        }

        /* REACTIONS */

        .reaction-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reaction-button {
            width: 65px;
            height: 55px;
            margin: 0;
            padding: 0;
            font-size: 28px;
            background: #10152b;
            border: 2px solid transparent;
        }

        .reaction-button.selected {
            border-color: #ffd166;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            min-height: 24px;
            color: #ffd166;
            font-weight: bold;
        }

        .back-button {
            display: block;
            width: 100%;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 9px;
            background: #242d52;
            color: white;
            font-weight: 800;
        }

        @media (max-width: 500px) {
            .robot-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<main class="customize-page">

    <div class="customize-title">
        CUSTOMIZE
    </div>

    <!-- 1. USERNAME -->

    <section class="customize-option">

        <div class="option-title">
            1. USERNAME
        </div>

        <input
            id="username"
            type="text"
            maxlength="16"
            placeholder="Enter your username"
        >

        <button id="save-username">
            SAVE USERNAME
        </button>

    </section>


    <!-- 2. HOME SCREEN LOOK -->

    <section class="customize-option">

        <div class="option-title">
            2. HOME SCREEN LOOK
        </div>

        <select id="home-look">
            <option value="classic">Classic</option>
            <option value="neon">Neon</option>
            <option value="dark">Dark</option>
        </select>

        <button id="save-look">
            APPLY LOOK
        </button>

    </section>


    <!-- 3. ROBOTS -->

    <section class="customize-option">

        <div class="option-title">
            3. ROBOTS
        </div>

        <div class="coin-display">
            🪙 ROBO COINS: <span id="coin-count">0</span>
        </div>

        <div class="robot-grid">

            <button class="robot-card" data-robot="default" data-price="0">
                <span class="robot-icon">🤖</span>
                <span class="robot-name">DEFAULT</span>
                <div class="robot-price">FREE</div>
            </button>

            <button class="robot-card" data-robot="blue" data-price="500">
                <span class="robot-icon">🔵</span>
                <span class="robot-name">BLUE</span>
                <div class="robot-price">500 RC</div>
            </button>

            <button class="robot-card" data-robot="red" data-price="1000">
                <span class="robot-icon">🔴</span>
                <span class="robot-name">RED</span>
                <div class="robot-price">1,000 RC</div>
            </button>

            <button class="robot-card" data-robot="green" data-price="1500">
                <span class="robot-icon">🟢</span>
                <span class="robot-name">GREEN</span>
                <div class="robot-price">1,500 RC</div>
            </button>

            <button class="robot-card" data-robot="purple" data-price="2000">
                <span class="robot-icon">🟣</span>
                <span class="robot-name">PURPLE</span>
                <div class="robot-price">2,000 RC</div>
            </button>

            <button class="robot-card" data-robot="neon" data-price="3000">
                <span class="robot-icon">⚡</span>
                <span class="robot-name">NEON</span>
                <div class="robot-price">3,000 RC</div>
            </button>

            <button class="robot-card" data-robot="titan" data-price="4000">
                <span class="robot-icon">🛡️</span>
                <span class="robot-name">TITAN</span>
                <div class="robot-price">4,000 RC</div>
            </button>

            <button class="robot-card" data-robot="cyber" data-price="5000">
                <span class="robot-icon">👾</span>
                <span class="robot-name">CYBER</span>
                <div class="robot-price">5,000 RC</div>
            </button>

            <button class="robot-card" data-robot="crystal" data-price="7500">
                <span class="robot-icon">💎</span>
                <span class="robot-name">CRYSTAL</span>
                <div class="robot-price">7,500 RC</div>
            </button>

            <button class="robot-card" data-robot="gold" data-price="10000">
                <span class="robot-icon">🥇</span>
                <span class="robot-name">GOLD</span>
                <div class="robot-price">10,000 RC</div>
            </button>

        </div>

    </section>


    <!-- 4. MENU ANIMATION -->

    <section class="customize-option">

        <div class="option-title">
            4. MENU ANIMATION
        </div>

        <select id="menu-animation">
            <option value="none">None</option>
            <option value="neon">Neon</option>
            <option value="slide">Slide</option>
            <option value="fade">Fade</option>
        </select>

        <button id="save-animation">
            APPLY ANIMATION
        </button>

    </section>


    <!-- 5. REACTIONS -->

    <section class="customize-option">

        <div class="option-title">
            5. REACTIONS
        </div>

        <div class="reaction-buttons">

            <button class="reaction-button" data-reaction="😎">😎</button>
            <button class="reaction-button" data-reaction="💩">💩</button>
            <button class="reaction-button" data-reaction="🔥">🔥</button>
            <button class="reaction-button" data-reaction="😂">😂</button>
            <button class="reaction-button" data-reaction="💀">💀</button>
            <button class="reaction-button" data-reaction="🤖">🤖</button>

        </div>

        <button id="save-reactions">
            SAVE REACTIONS
        </button>

    </section>


    <div id="status"></div>

    <a class="back-button" href="index.html">
        BACK TO MENU
    </a>

</main>


<script>

/* =========================
   USERNAME
========================= */

const usernameInput =
    document.getElementById("username");

usernameInput.value =
    localStorage.getItem("roboClashUsername") || "";

document.getElementById("save-username")
    .addEventListener("click", () => {

        let name =
            usernameInput.value.trim();

        if (name === "") {
            name = "Player";
        }

        localStorage.setItem(
            "roboClashUsername",
            name
        );

        document.getElementById("status")
            .textContent =
            "USERNAME SAVED: " + name;
    });


/* =========================
   HOME LOOK
========================= */

const homeLook =
    document.getElementById("home-look");

homeLook.value =
    localStorage.getItem(
        "roboClashHomeLook"
    ) || "classic";

document.getElementById("save-look")
    .addEventListener("click", () => {

        localStorage.setItem(
            "roboClashHomeLook",
            homeLook.value
        );

        document.getElementById("status")
            .textContent =
            "HOME SCREEN LOOK SAVED";
    });


/* =========================
   ROBOTS
========================= */

const coinCount =
    document.getElementById("coin-count");

const robotCards =
    document.querySelectorAll(".robot-card");

let coins =
    Number(
        localStorage.getItem("roboClashCoins") || 0
    );

let unlockedRobots =
    JSON.parse(
        localStorage.getItem("roboClashUnlocked") ||
        '["default"]'
    );

if (!Array.isArray(unlockedRobots)) {
    unlockedRobots = ["default"];
}

if (!unlockedRobots.includes("default")) {
    unlockedRobots.push("default");
}

function saveUnlocked() {
    localStorage.setItem(
        "roboClashUnlocked",
        JSON.stringify(unlockedRobots)
    );
}

function updateRobots() {

    coins = Number(
        localStorage.getItem("roboClashCoins") || 0
    );

    coinCount.textContent =
        coins.toLocaleString();

    const equipped =
        localStorage.getItem("roboClashRobot") ||
        "default";

    robotCards.forEach(card => {

        const robot = card.dataset.robot;
        const price = Number(card.dataset.price);
        const unlocked =
            unlockedRobots.includes(robot);

        card.classList.toggle(
            "locked",
            !unlocked
        );

        card.classList.toggle(
            "selected",
            robot === equipped
        );

        const priceText =
            card.querySelector(".robot-price");

        if (unlocked) {
            priceText.textContent =
                robot === equipped
                    ? "EQUIPPED"
                    : "EQUIP";
        } else {
            priceText.textContent =
                price.toLocaleString() +
                " RC • BUY";
        }
    });
}

robotCards.forEach(card => {

    card.addEventListener("click", () => {

        const robot = card.dataset.robot;
        const price = Number(card.dataset.price);

        /* LOCKED ROBOT = BUY ONLY */
        if (!unlockedRobots.includes(robot)) {

            if (coins < price) {
                document.getElementById("status")
                    .textContent =
                    "NOT ENOUGH ROBO COINS";
                return;
            }

            coins -= price;

            localStorage.setItem(
                "roboClashCoins",
                coins
            );

            unlockedRobots.push(robot);
            saveUnlocked();

            localStorage.setItem(
                "roboClashRobot",
                robot
            );

            document.getElementById("status")
                .textContent =
                card.querySelector(".robot-name")
                    .textContent +
                " BOUGHT AND EQUIPPED";

            updateRobots();
            return;
        }

        /* ALREADY UNLOCKED = EQUIP */
        localStorage.setItem(
            "roboClashRobot",
            robot
        );

        document.getElementById("status")
            .textContent =
            card.querySelector(".robot-name")
                .textContent +
            " ROBOT EQUIPPED";

        updateRobots();
    });

});

saveUnlocked();
updateRobots();


/* =========================
   MENU ANIMATION
========================= */

const menuAnimation =
    document.getElementById("menu-animation");

menuAnimation.value =
    localStorage.getItem(
        "roboClashMenuAnimation"
    ) || "none";

document.getElementById("save-animation")
    .addEventListener("click", () => {

        localStorage.setItem(
            "roboClashMenuAnimation",
            menuAnimation.value
        );

        document.getElementById("status")
            .textContent =
            "MENU ANIMATION SAVED: " +
            menuAnimation.value.toUpperCase();
    });


/* =========================
   REACTIONS
========================= */

const reactionButtons =
    document.querySelectorAll(
        ".reaction-button"
    );

let savedReactions =
    JSON.parse(
        localStorage.getItem(
            "roboClashReactions"
        ) || "[]"
    );

reactionButtons.forEach(button => {

    if (
        savedReactions.includes(
            button.dataset.reaction
        )
    ) {
        button.classList.add("selected");
    }

    button.addEventListener("click", () => {

        button.classList.toggle("selected");

    });

});


document.getElementById("save-reactions")
    .addEventListener("click", () => {

        const selected = [];

        reactionButtons.forEach(button => {

            if (
                button.classList.contains(
                    "selected"
                )
            ) {
                selected.push(
                    button.dataset.reaction
                );
            }

        });

        localStorage.setItem(
            "roboClashReactions",
            JSON.stringify(selected)
        );

        document.getElementById("status")
            .textContent =
            "REACTIONS SAVED";
    });

</script>

</body>
</html>
