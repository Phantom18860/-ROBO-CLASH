<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROBO CLASH — Customize</title>

    <link rel="stylesheet" href="css/main.css">

    <style>
        body {
            margin: 0;
            background: #10152b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .customize-page {
            width: min(700px, 92%);
            margin: 40px auto;
        }

        .customize-title {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .customize-option {
            background: #1b2342;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .option-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #10152b;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 13px 22px;
            margin-top: 10px;
            border: 0;
            border-radius: 9px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        .reaction-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reaction-button {
            width: 65px;
            height: 55px;
            margin: 0;
            padding: 0;
            font-size: 28px;
            background: #10152b;
            border: 2px solid transparent;
        }

        .reaction-button.selected {
            border-color: #ffd166;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            min-height: 24px;
            color: #ffd166;
            font-weight: bold;
        }

        .back-button {
            display: block;
            width: 100%;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 9px;
            background: #242d52;
            color: white;
            font-weight: 800;
        }
    </style>
</head>

<body>

<main class="customize-page">

    <div class="customize-title">
        CUSTOMIZE
    </div>

    <!-- 1. USERNAME -->
    <section class="customize-option">
        <div class="option-title">1. USERNAME</div>

        <input
            id="username"
            type="text"
            maxlength="16"
            placeholder="Enter your username"
        >

        <button id="save-username">
            SAVE USERNAME
        </button>
    </section>


    <!-- 2. HOME SCREEN LOOK -->
    <section class="customize-option">
        <div class="option-title">2. HOME SCREEN LOOK</div>

        <select id="home-look">
            <option value="classic">Classic</option>
            <option value="neon">Neon</option>
            <option value="dark">Dark</option>
        </select>

        <button id="save-look">
            APPLY LOOK
        </button>
    </section>


    <!-- 3. ROBOTS -->
    <section class="customize-option">
        <div class="option-title">3. ROBOTS</div>

        <select id="robot">
            <option value="default">Default Robot</option>
            <option value="blue">Blue Robot</option>
            <option value="red">Red Robot</option>
            <option value="gold">Gold Robot</option>
        </select>

        <button id="save-robot">
            SELECT ROBOT
        </button>
    </section>


    <!-- 4. MENU ANIMATION -->
    <section class="customize-option">
        <div class="option-title">4. MENU ANIMATION</div>

        <select id="menu-animation">
            <option value="none">None</option>
            <option value="neon">Neon</option>
            <option value="slide">Slide</option>
            <option value="fade">Fade</option>
        </select>

        <button id="save-animation">
            APPLY ANIMATION
        </button>
    </section>


    <!-- 5. REACTIONS -->
    <section class="customize-option">
        <div class="option-title">5. REACTIONS</div>

        <div class="reaction-buttons">

            <button class="reaction-button" data-reaction="😎">
                😎
            </button>

            <button class="reaction-button" data-reaction="💩">
                💩
            </button>

            <button class="reaction-button" data-reaction="🔥">
                🔥
            </button>

            <button class="reaction-button" data-reaction="😂">
                😂
            </button>

            <button class="reaction-button" data-reaction="💀">
                💀
            </button>

            <button class="reaction-button" data-reaction="🤖">
                🤖
            </button>

        </div>

        <button id="save-reactions">
            SAVE REACTIONS
        </button>
    </section>


    <div id="status"></div>

    <a class="back-button" href="index.html">
        BACK TO MENU
    </a>

</main>


<script>

const usernameInput = document.getElementById("username");
const homeLook = document.getElementById("home-look");
const robotSelect = document.getElementById("robot");
const menuAnimation = document.getElementById("menu-animation");
const status = document.getElementById("status");


/* LOAD SAVED SETTINGS */

usernameInput.value =
    localStorage.getItem("roboClashUsername") || "";

homeLook.value =
    localStorage.getItem("roboClashHomeLook") || "classic";

robotSelect.value =
    localStorage.getItem("roboClashRobot") || "default";

menuAnimation.value =
    localStorage.getItem("roboClashMenuAnimation") || "none";


/* USERNAME */

document.getElementById("save-username")
    .addEventListener("click", () => {

        let name = usernameInput.value.trim();

        if (name === "") {
            name = "Player";
        }

        localStorage.setItem(
            "roboClashUsername",
            name
        );

        status.textContent =
            "USERNAME SAVED: " + name;
    });


/* HOME LOOK */

document.getElementById("save-look")
    .addEventListener("click", () => {

        localStorage.setItem(
            "roboClashHomeLook",
            homeLook.value
        );

        status.textContent =
            "HOME SCREEN LOOK SAVED";
    });


/* ROBOT */

document.getElementById("save-robot")
    .addEventListener("click", () => {

        localStorage.setItem(
            "roboClashRobot",
            robotSelect.value
        );

        status.textContent =
            "ROBOT SAVED";
    });


/* MENU ANIMATION */

document.getElementById("save-animation")
    .addEventListener("click", () => {

        localStorage.setItem(
            "roboClashMenuAnimation",
            menuAnimation.value
        );

        status.textContent =
            "MENU ANIMATION SAVED: " +
            menuAnimation.value.toUpperCase();
    });


/* REACTIONS */

const reactionButtons =
    document.querySelectorAll(".reaction-button");

reactionButtons.forEach(button => {

    const reaction =
        button.dataset.reaction;

    const saved =
        JSON.parse(
            localStorage.getItem("roboClashReactions") || "[]"
        );

    if (saved.includes(reaction)) {
        button.classList.add("selected");
    }

    button.addEventListener("click", () => {

        button.classList.toggle("selected");

    });

});


document.getElementById("save-reactions")
    .addEventListener("click", () => {

        const selected = [];

        reactionButtons.forEach(button => {

            if (button.classList.contains("selected")) {
                selected.push(button.dataset.reaction);
            }

        });

        localStorage.setItem(
            "roboClashReactions",
            JSON.stringify(selected)
        );

        status.textContent =
            "REACTIONS SAVED";
    });

</script>

</body>
</html>
