<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROBO CLASH - ROOMS</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        .rooms-page {
            width: min(700px, 92%);
            margin: 0 auto;
            text-align: center;
            padding-top: 25px;
        }

        /* Room code ABOVE the ROOMS title */
        .room-code-top {
            margin: 0 auto 12px;
        }

        .room-code-label {
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        #roomCode {
            font-size: 54px;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;
            color: #65d8ff;
            text-shadow: 0 0 18px rgba(70, 190, 255, 0.8);
            min-height: 58px;
        }

        .rooms-title {
            font-size: clamp(42px, 9vw, 72px);
            font-weight: 900;
            letter-spacing: 5px;
            margin: 10px 0 30px;
            text-shadow: 0 0 18px rgba(70, 180, 255, 0.8);
        }

        .rooms-card {
            background: rgba(10, 20, 38, 0.92);
            border: 1px solid rgba(70, 180, 255, 0.35);
            border-radius: 20px;
            padding: 25px;
            box-shadow:
                0 0 30px rgba(0, 120, 255, 0.12),
                inset 0 0 30px rgba(0, 120, 255, 0.04);
        }

        .room-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .room-action {
            min-height: 64px;
            border-radius: 14px;
            border: 1px solid rgba(80, 190, 255, 0.5);
            background: rgba(30, 70, 110, 0.45);
            color: white;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .room-action:hover {
            transform: translateY(-2px);
            background: rgba(40, 100, 155, 0.65);
        }

        .room-action.primary {
            background: rgba(40, 140, 255, 0.7);
            box-shadow: 0 0 18px rgba(40, 150, 255, 0.25);
        }

        .room-action:active {
            transform: scale(0.97);
        }

        #roomPanel {
            margin-top: 25px;
        }

        #roomPanel h2 {
            margin-bottom: 20px;
        }

        .players-list {
            margin-top: 15px;
        }

        .player-slot {
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #message {
            min-height: 20px;
            margin: 15px 0;
            opacity: 0.75;
        }

        .back-button {
            display: block;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .room-actions {
                grid-template-columns: 1fr;
            }

            .rooms-card {
                padding: 16px;
            }

            #roomCode {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<main class="rooms-page">

    <!-- BIG ROOM CODE AT THE TOP -->
    <div class="room-code-top">

        <div class="room-code-label">
            ROOM CODE
        </div>

        <div id="roomCode">
            ------
        </div>

    </div>

    <!-- ROOMS TITLE -->
    <h1 class="rooms-title">
        ROOMS
    </h1>

    <section class="rooms-card">

        <div class="room-actions">

            <button
                class="room-action primary"
                id="createRoom"
                type="button"
            >
                CREATE ROOM
            </button>

            <button
                class="room-action"
                id="joinRoom"
                type="button"
            >
                JOIN ROOM
            </button>

        </div>

        <div id="roomPanel" style="display:none;">

            <h2>ROBO CLASH PARTY</h2>

            <p id="roomPlayers">
                PLAYERS: 1
            </p>

            <div
                class="players-list"
                id="playersList"
            >
                <div class="player-slot">
                    🤖 PLAYER 1
                </div>
            </div>

            <button
                class="room-action primary"
                id="startGame"
                type="button"
            >
                START BATTLE
            </button>

        </div>

        <p id="message">
            Create a room or join a party.
        </p>

        <a
            class="menu-button back-button"
            href="index.html"
        >
            ← BACK TO MENU
        </a>

    </section>

</main>


<script>

    const createRoom =
        document.getElementById("createRoom");

    const joinRoom =
        document.getElementById("joinRoom");

    const roomPanel =
        document.getElementById("roomPanel");

    const roomCode =
        document.getElementById("roomCode");

    const roomPlayers =
        document.getElementById("roomPlayers");

    const playersList =
        document.getElementById("playersList");

    const startGame =
        document.getElementById("startGame");

    const message =
        document.getElementById("message");


    function generateRoomCode() {

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for (let i = 0; i < 6; i++) {

            code += characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

        }

        return code;
    }


    function showRoom(code) {

        roomCode.textContent = code;

        roomPanel.style.display = "block";

        createRoom.style.display = "none";

        joinRoom.style.display = "none";

    }


    createRoom.addEventListener(
        "click",
        () => {

            const code =
                generateRoomCode();

            showRoom(code);

            message.textContent =
                "ROOM CREATED! SEND THE CODE TO YOUR FRIEND.";

        }
    );


    joinRoom.addEventListener(
        "click",
        () => {

            const enteredCode =
                prompt("ENTER ROOM CODE:");

            if (!enteredCode) {
                return;
            }

            const code =
                enteredCode
                    .trim()
                    .toUpperCase();

            if (code.length !== 6) {

                message.textContent =
                    "ROOM CODE MUST BE 6 CHARACTERS.";

                return;
            }

            showRoom(code);

            message.textContent =
                "JOINED ROOM " + code + "!";

        }
    );


    startGame.addEventListener(
        "click",
        () => {

            window.location.href =
                "game.html";

        }
    );

</script>

</body>
</html>
