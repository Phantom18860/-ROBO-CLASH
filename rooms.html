<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROBO CLASH - ROOMS</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        .rooms-page {
            width: min(700px, 92%);
            margin: 0 auto;
            text-align: center;
            padding-top: 25px;
        }

        .room-code-top {
            margin-bottom: 15px;
        }

        .room-code-label {
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        #roomCode {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 0;
            line-height: 1.1;
            color: #65d8ff;
            text-shadow: 0 0 18px rgba(70, 190, 255, 0.8);
            min-height: 66px;
        }

        .rooms-title {
            font-size: clamp(42px, 9vw, 72px);
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0 0 30px;
            text-shadow: 0 0 18px rgba(70, 180, 255, 0.8);
        }

        .rooms-card {
            background: rgba(10, 20, 38, 0.92);
            border: 1px solid rgba(70, 180, 255, 0.35);
            border-radius: 20px;
            padding: 25px;
            box-shadow:
                0 0 30px rgba(0, 120, 255, 0.12),
                inset 0 0 30px rgba(0, 120, 255, 0.04);
        }

        .room-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .room-action {
            min-height: 64px;
            border-radius: 14px;
            border: 1px solid rgba(80, 190, 255, 0.5);
            background: rgba(30, 70, 110, 0.45);
            color: white;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        .room-action:hover {
            transform: translateY(-2px);
            background: rgba(40, 100, 155, 0.65);
        }

        .room-action.primary {
            background: rgba(40, 140, 255, 0.7);
            box-shadow: 0 0 18px rgba(40, 150, 255, 0.25);
        }

        .room-action:active {
            transform: scale(0.97);
        }

        #roomPanel {
            margin-top: 25px;
        }

        .players-list {
            margin: 15px 0;
        }

        .player-slot {
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #message {
            min-height: 20px;
            margin: 15px 0;
            opacity: 0.75;
        }

        .back-button {
            display: block;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .room-actions {
                grid-template-columns: 1fr;
            }

            .rooms-card {
                padding: 16px;
            }

            #roomCode {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<main class="rooms-page">

    <!-- BIG ROOM CODE ABOVE ROOMS -->

    <div class="room-code-top">

        <div class="room-code-label">
            ROOM CODE
        </div>

        <div id="roomCode">
            ------
        </div>

    </div>


    <h1 class="rooms-title">
        ROOMS
    </h1>


    <section class="rooms-card">

        <div class="room-actions">

            <button
                class="room-action primary"
                id="createRoom"
                type="button"
            >
                CREATE ROOM
            </button>

            <button
                class="room-action"
                id="joinRoom"
                type="button"
            >
                JOIN ROOM
            </button>

        </div>


        <div
            id="roomPanel"
            style="display:none;"
        >

            <h2>
                ROBO CLASH PARTY
            </h2>

            <p id="roomPlayers">
                PLAYERS: 0
            </p>

            <div
                class="players-list"
                id="playersList"
            ></div>

            <button
                class="room-action primary"
                id="startGame"
                type="button"
            >
                START BATTLE
            </button>

        </div>


        <p id="message">
            Create a room or join a party.
        </p>


        <a
            class="menu-button back-button"
            href="index.html"
        >
            ← BACK TO MENU
        </a>

    </section>

</main>


<script type="module">

    import { createClient }
        from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
        "https://kcvgqdwquzvpnvfxcinc.supabase.co";

    const SUPABASE_KEY =
        "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =========================
    // PLAYER ID
    // =========================

    let playerId =
        sessionStorage.getItem(
            "roboClashPlayerId"
        );

    if (!playerId) {

        playerId =
            crypto.randomUUID();

        sessionStorage.setItem(
            "roboClashPlayerId",
            playerId
        );
    }


    let currentRoom = null;
    let isHost = false;
    let roomChannel = null;


    // =========================
    // ELEMENTS
    // =========================

    const createRoom =
        document.getElementById(
            "createRoom"
        );

    const joinRoom =
        document.getElementById(
            "joinRoom"
        );

    const roomPanel =
        document.getElementById(
            "roomPanel"
        );

    const roomCode =
        document.getElementById(
            "roomCode"
        );

    const roomPlayers =
        document.getElementById(
            "roomPlayers"
        );

    const playersList =
        document.getElementById(
            "playersList"
        );

    const startGame =
        document.getElementById(
            "startGame"
        );

    const message =
        document.getElementById(
            "message"
        );


    // =========================
    // ROOM CODE GENERATOR
    // =========================

    function generateRoomCode() {

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for (let i = 0; i < 6; i++) {

            code +=
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];

        }

        return code;
    }


    // =========================
    // SHOW MESSAGE
    // =========================

    function showMessage(text) {

        message.textContent = text;

    }


    // =========================
    // DISPLAY ROOM
    // =========================

    function showRoom() {

        roomPanel.style.display =
            "block";

        createRoom.style.display =
            "none";

        joinRoom.style.display =
            "none";

    }


    // =========================
    // DISPLAY PLAYERS
    // =========================

    function displayPlayers(players) {

        roomPlayers.textContent =
            "PLAYERS: " + players.length;

        playersList.innerHTML = "";

        players.forEach(
            (player, index) => {

                const playerSlot =
                    document.createElement(
                        "div"
                    );

                playerSlot.className =
                    "player-slot";

                playerSlot.textContent =
                    "🤖 PLAYER " +
                    (index + 1) +
                    (player.host
                        ? " • HOST"
                        : "");

                playersList.appendChild(
                    playerSlot
                );

            }
        );

    }


    // =========================
    // SUBSCRIBE TO ROOM
    // =========================

    function subscribeToRoom(code) {

        if (roomChannel) {

            supabase.removeChannel(
                roomChannel
            );

        }


        roomChannel =
            supabase
                .channel(
                    "robo-clash-room-" +
                    code
                )
                .on(
                    "postgres_changes",
                    {
                        event: "UPDATE",
                        schema: "public",
                        table: "rooms",
                        filter:
                            "code=eq." + code
                    },
                    payload => {

                        const room =
                            payload.new;

                        if (!room) {
                            return;
                        }

                        displayPlayers(
                            room.players || []
                        );


                        if (
                            room.started === true
                        ) {

                            window.location.href =
                                "game.html";

                        }

                    }
                )
                .subscribe();

    }


    // =========================
    // CREATE ROOM
    // =========================

    createRoom.addEventListener(
        "click",
        async () => {

            createRoom.disabled =
                true;

            showMessage(
                "CREATING ROOM..."
            );


            const code =
                generateRoomCode();


            const players = [
                {
                    id: playerId,
                    name: "PLAYER 1",
                    host: true
                }
            ];


            const { error } =
                await supabase
                    .from("rooms")
                    .insert({
                        code: code,
                        host_id: playerId,
                        players: players,
                        started: false
                    });


            if (error) {

                console.error(error);

                showMessage(
                    "COULD NOT CREATE ROOM."
                );

                createRoom.disabled =
                    false;

                return;

            }


            currentRoom = code;
            isHost = true;


            roomCode.textContent =
                code;

            displayPlayers(
                players
            );

            showRoom();


            showMessage(
                "ROOM CREATED! SEND THE CODE TO YOUR FRIEND."
            );


            subscribeToRoom(
                code
            );

        }
    );


    // =========================
    // JOIN ROOM
    // =========================

    joinRoom.addEventListener(
        "click",
        async () => {

            const enteredCode =
                prompt(
                    "ENTER ROOM CODE:"
                );


            if (!enteredCode) {
                return;
            }


            const code =
                enteredCode
                    .trim()
                    .toUpperCase();


            if (code.length !== 6) {

                showMessage(
                    "ROOM CODE MUST BE 6 CHARACTERS."
                );

                return;

            }


            showMessage(
                "SEARCHING FOR ROOM..."
            );


            const { data, error } =
                await supabase
                    .from("rooms")
                    .select("*")
                    .eq(
                        "code",
                        code
                    )
                    .maybeSingle();


            if (error) {

                console.error(error);

                showMessage(
                    "COULD NOT CONNECT TO ROOMS."
                );

                return;

            }


            if (!data) {

                showMessage(
                    "ROOM NOT FOUND."
                );

                return;

            }


            if (data.started) {

                showMessage(
                    "THAT BATTLE HAS ALREADY STARTED."
                );

                return;

            }


            const players =
                Array.isArray(
                    data.players
                )
                    ? data.players
                    : [];


            const alreadyJoined =
                players.some(
                    player =>
                        player.id === playerId
                );


            if (!alreadyJoined) {

                players.push({

                    id: playerId,

                    name:
                        "PLAYER " +
                        (players.length + 1),

                    host: false

                });

            }


            const { error: updateError } =
                await supabase
                    .from("rooms")
                    .update({
                        players: players
                    })
                    .eq(
                        "code",
                        code
                    );


            if (updateError) {

                console.error(
                    updateError
                );

                showMessage(
                    "COULD NOT JOIN ROOM."
                );

                return;

            }


            currentRoom = code;
            isHost = false;


            roomCode.textContent =
                code;

            displayPlayers(
                players
            );

            showRoom();


            showMessage(
                "JOINED ROOM!"
            );


            subscribeToRoom(
                code
            );

        }
    );


    // =========================
    // START BATTLE
    // =========================

    startGame.addEventListener(
        "click",
        async () => {

            if (!currentRoom) {
                return;
            }


            if (!isHost) {

                showMessage(
                    "ONLY THE HOST CAN START."
                );

                return;

            }


            showMessage(
                "STARTING BATTLE..."
            );


            const { error } =
                await supabase
                    .from("rooms")
                    .update({
                        started: true
                    })
                    .eq(
                        "code",
                        currentRoom
                    );


            if (error) {

                console.error(error);

                showMessage(
                    "COULD NOT START BATTLE."
                );

                return;

            }


            window.location.href =
                "game.html";

        }
    );

</script>

</body>
</html>
